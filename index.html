<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Misión Producción Multimedia</title>
<style>
:root{--c1:#ff6b6b;--c2:#feca57}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;min-height:100vh;color:#2d3436;background:linear-gradient(135deg,var(--c1),var(--c2)) fixed;touch-action:manipulation}
#app{max-width:760px;margin:0 auto;padding:10px 12px 50px}
canvas#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
h1,h2,h3{margin:0}
h2{font-size:22px;line-height:1.25}
.card{background:#fff;border-radius:24px;padding:18px;box-shadow:0 8px 0 rgba(0,0,0,.14);margin-top:14px;animation:pop .35s}
.center{text-align:center}
.hud{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.95);border-radius:0 0 22px 22px;padding:8px 10px 10px;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.hrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:#f1f2f6;border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.chip.lv{background:#6c5ce7;color:#fff}
.icon{margin-left:auto;font-size:20px;border:0;background:#f1f2f6;border-radius:50%;width:38px;height:38px;cursor:pointer}
.bar{height:12px;background:#dfe6e9;border-radius:99px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#00b894,#fdcb6e,#ff7675);border-radius:99px;transition:width .5s}
.btn{display:block;width:100%;font:inherit;font-weight:900;font-size:20px;padding:15px;border:0;border-radius:18px;color:#fff;background:linear-gradient(#ff7675,#d63031);box-shadow:0 6px 0 #8f1f1f;cursor:pointer;margin-top:16px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8f1f1f}
.btn.green{background:linear-gradient(#55efc4,#00b894);box-shadow:0 6px 0 #006b55}
.btn.blue{background:linear-gradient(#74b9ff,#0984e3);box-shadow:0 6px 0 #0a4f8f}
.btn.purple{background:linear-gradient(#a29bfe,#6c5ce7);box-shadow:0 6px 0 #3f33a6}
.btn.small{font-size:16px;padding:11px}
.mascot{font-size:64px;display:inline-block;animation:bounce 1.2s infinite}
.title{font-size:34px;font-weight:900;line-height:1.1;margin:6px 0;background:linear-gradient(90deg,#ff4757,#ffa502,#2ed573,#1e90ff,#a55eea);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#636e72;font-weight:700;margin:6px 0 4px}
input[type=text]{width:100%;font:inherit;font-size:20px;font-weight:700;padding:14px;border-radius:16px;border:4px solid #a29bfe;outline:none;text-align:center;margin-top:10px}
input[type=text]:focus{border-color:#ff7675}
.rules{text-align:left;background:#fff7d6;border-radius:16px;padding:10px 14px;font-size:15px;font-weight:600;margin-top:14px}
.rules li{margin:4px 0}
.qn{font-size:13px;font-weight:900;color:#fff;background:#00b894;display:inline-block;border-radius:99px;padding:3px 12px;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-size:18px;font-weight:700;padding:11px 12px;border-radius:16px;border:3px solid;background:#fff;margin-top:10px;cursor:pointer;color:#2d3436}
.opt .l{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}
.opt:active:not([disabled]){transform:scale(.98)}
.o0{border-color:#ff7675}.o0 .l{background:#ff7675}
.o1{border-color:#0984e3}.o1 .l{background:#0984e3}
.o2{border-color:#00b894}.o2 .l{background:#00b894}
.o3{border-color:#e1a400}.o3 .l{background:#e1a400}
.opt.ok{background:#b8f5d7;border-color:#00b894;animation:pop .35s}
.opt.bad{background:#ffd0d0;border-color:#d63031;animation:shake .4s}
.opt[disabled]{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{justify-content:center;font-size:20px;margin-top:6px}
.fbox{border-radius:18px;padding:12px 14px;margin-top:14px;animation:pop .3s}
.fbox.good{background:#d6f8e8;border:3px solid #00b894}
.fbox.mid{background:#fff3cd;border:3px solid #e1a400}
.fbox.nope{background:#ffe0e0;border:3px solid #d63031}
.fbox b{font-size:19px}
.fbox p{margin:6px 0 0;font-weight:600}
.viz{position:relative;border:5px solid #2d3436;border-radius:16px;overflow:hidden;margin:10px auto;max-width:480px;background:#fff}
.viz svg{display:block;width:100%;height:auto}
.rec{position:absolute;top:8px;left:12px;color:#fff;font-weight:900;font-size:13px;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:99px}
.rec i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff3838;margin-right:5px;animation:blink 1s infinite}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mi{font:inherit;font-weight:800;font-size:15px;padding:10px 8px;min-height:58px;border-radius:14px;border:3px solid #b2bec3;background:#fff;cursor:pointer;color:#2d3436;margin-bottom:8px;width:100%}
.mi.sel{border-color:#6c5ce7;background:#e9e6ff;transform:scale(1.03)}
.mi.shake{animation:shake .4s;border-color:#d63031}
.mi.p0{background:#ffd3d3;border-color:#ff7675}.mi.p1{background:#cfe8ff;border-color:#0984e3}
.mi.p2{background:#c9f7e3;border-color:#00b894}.mi.p3{background:#fff0b8;border-color:#e1a400}
.mi[disabled]{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip2{font:inherit;font-weight:800;font-size:17px;padding:10px 14px;border-radius:14px;border:3px solid #6c5ce7;background:#f0eeff;cursor:pointer;color:#2d3436}
.chip2[disabled]{opacity:.25}
.chip2.shake{animation:shake .4s;border-color:#d63031}
.slots{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.slots li{background:#d6f8e8;border:3px dashed #00b894;border-radius:12px;padding:8px 12px;font-weight:800;min-height:42px}
.slots li.empty{background:#f1f2f6;border-color:#b2bec3;color:#b2bec3}
.pts{padding-left:18px;font-weight:600}
.pts li{margin:8px 0;line-height:1.35}
.stars{font-size:46px;letter-spacing:4px}
.st.off{filter:grayscale(1);opacity:.25}
.lvrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-weight:800;font-size:14px}
.lvrow .nm{flex:1;min-width:0}
.lvrow .pb{flex:1.2;height:14px;background:#dfe6e9;border-radius:99px;overflow:hidden}
.lvrow .pb i{display:block;height:100%}
.grade{font-size:72px;font-weight:900;line-height:1}
.pass{color:#00b894}.fail{color:#d63031}
a.dl{display:block;text-align:center;margin-top:12px;font-weight:800;color:#0984e3}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px) rotate(-6deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
@keyframes blink{50%{opacity:.2}}
@media(max-width:420px){.title{font-size:28px}h2{font-size:20px}.opt{font-size:16px}}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="confetti"></canvas>
